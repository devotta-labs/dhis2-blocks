packages:
    - apps/*
    - packages/*

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild

overrides:
    i18next-scanner>i18next: 10.6.0

patchedDependencies:
    '@dhis2/app-adapter@12.10.3': patches/@dhis2__app-adapter@12.10.3.patch
    '@dhis2/cli-app-scripts@12.10.3': patches/@dhis2__cli-app-scripts@12.10.3.patch

publicHoistPattern:
    - '@dhis2/ui'
    - typeface-roboto
    - '@dhis2/app-adapter'
    - prop-types
    - '@dhis2/d2-i18n'
    - post-robot
    - styled-jsx
    - '@dhis2/pwa'
