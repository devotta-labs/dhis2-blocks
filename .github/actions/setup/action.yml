name: Workspace setup
description: Install dependencies and restore task and browser caches

inputs:
    task:
        description: Isolated Turbo cache lane (empty disables the task cache)
        default: ''
    browser:
        description: Install and cache Playwright Chromium
        default: 'false'

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v4
          with:
              version: 10.13.1

        - uses: actions/setup-node@v4
          with:
              node-version: 22
              cache: pnpm

        - run: pnpm install --frozen-lockfile
          shell: bash

        - if: inputs.task != ''
          uses: actions/cache@v4
          with:
              path: .turbo/cache
              key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ inputs.task }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
              restore-keys: |
                  turbo-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ inputs.task }}-${{ hashFiles('pnpm-lock.yaml') }}-
                  turbo-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ inputs.task }}-

        - if: inputs.browser == 'true'
          id: playwright
          run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          shell: bash

        - if: inputs.browser == 'true'
          uses: actions/cache@v4
          with:
              path: ~/.cache/ms-playwright
              key: playwright-ubuntu24-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

        - if: inputs.browser == 'true'
          run: |
              pnpm exec playwright install chromium
              # Hosted runners already have Chromium's libraries; only use apt if needed.
              if ! node -e "require('@playwright/test').chromium.launch().then(browser => browser.close()).catch(() => process.exit(1))"; then
                  pnpm exec playwright install-deps chromium
              fi
          shell: bash
