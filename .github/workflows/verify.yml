name: verify

on:
    push:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validation:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: install
              run: pnpm install --frozen-lockfile

            - name: locales
              run: pnpm --filter @dhis2-blocks/web exec d2-app-scripts i18n generate

            - name: typescript
              run: pnpm typecheck

            - name: component browser
              run: pnpm exec playwright install --with-deps chromium

            - name: test
              run: pnpm test

            - name: build
              run: pnpm build

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: install
              run: pnpm install --frozen-lockfile

            - name: lint
              run: pnpm lint

    knip:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: install
              run: pnpm install --frozen-lockfile

            - name: dead code audit
              run: pnpm dead-code:audit

    registry:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: install
              run: pnpm install --frozen-lockfile

            - name: registry install check
              run: pnpm registry:check

    e2e:
        needs: [validation, lint, knip]
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                dhis2: ['41', '42', '43', 'dev']

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: install
              run: pnpm install --frozen-lockfile

            - name: browser
              run: pnpm exec playwright install --with-deps chromium

            - name: validate
              run: bash scripts/e2e/validate.sh '${{ matrix.dhis2 }}'

            - name: e2e
              run: bash scripts/e2e/run-version.sh '${{ matrix.dhis2 }}'
              env:
                  CI: 'true'
                  E2E_DHIS2_USERNAME: admin
                  E2E_DHIS2_PASSWORD: district

            - name: artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-dhis2-${{ matrix.dhis2 }}-${{ github.run_attempt }}
                  path: e2e/artifacts/${{ matrix.dhis2 }}/
                  if-no-files-found: warn
                  retention-days: 14
