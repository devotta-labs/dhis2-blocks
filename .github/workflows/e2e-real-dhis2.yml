name: e2e real DHIS2 matrix

on:
    pull_request:
    push:
        branches: [master, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-real-dhis2-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Static checks, unit tests, and production build
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Build and inspect the library package
              run: pnpm package:check

            - name: Lint and check formatting
              run: pnpm lint

            - name: Run unit tests
              run: pnpm test

            - name: Build the production bundle
              run: pnpm build

    browser:
        name: DHIS2 ${{ matrix.dhis2 }}
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                dhis2: ['41', '42', '43', 'dev']

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium and system dependencies
              run: pnpm exec playwright install --with-deps chromium

            - name: Validate official image/database target
              run: bash scripts/e2e/validate.sh '${{ matrix.dhis2 }}'

            - name: Run the real-server browser suite
              run: bash scripts/e2e/run-version.sh '${{ matrix.dhis2 }}'
              env:
                  CI: 'true'
                  E2E_DHIS2_USERNAME: admin
                  E2E_DHIS2_PASSWORD: district

            - name: Upload browser and server diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-dhis2-${{ matrix.dhis2 }}-${{ github.run_attempt }}
                  path: e2e/artifacts/${{ matrix.dhis2 }}/
                  if-no-files-found: warn
                  retention-days: 14
