packages:
    - apps/*
    - packages/*

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild

patchedDependencies:
    '@dhis2-ui/sharing-dialog@10.13.0': patches/@dhis2-ui__sharing-dialog@10.13.0.patch
    '@dhis2-ui/transfer@10.13.0': patches/@dhis2-ui__transfer@10.13.0.patch

publicHoistPattern:
    - '@dhis2/ui'
    - typeface-roboto
    - '@dhis2/app-adapter'
    - prop-types
    - '@dhis2/d2-i18n'
    - post-robot
    - styled-jsx
    - '@dhis2/app-adapter'
    - '@dhis2/pwa'
