packages:
    - apps/*
    - packages/*

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild

patchedDependencies:
    '@dhis2/app-adapter@12.10.3': patches/@dhis2__app-adapter@12.10.3.patch

publicHoistPattern:
    - '@dhis2/ui'
    - typeface-roboto
    - '@dhis2/app-adapter'
    - prop-types
    - '@dhis2/d2-i18n'
    - post-robot
    - styled-jsx
    - '@dhis2/pwa'
