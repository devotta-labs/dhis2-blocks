name: verify

on:
    push:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            web: ${{ steps.filter.outputs.web }}
            docs: ${{ steps.filter.outputs.docs }}
            quality: ${{ steps.filter.outputs.quality }}
            e2e: ${{ steps.filter.outputs.e2e }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  base: ${{ github.event.repository.default_branch }}
                  filters: .github/filters.yml

    typecheck:
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  task: typecheck
            - run: pnpm --filter @dhis2-blocks/web exec d2-app-scripts i18n generate
            - run: pnpm typecheck

    test:
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  task: test
                  browser: 'true'
            - run: pnpm test

    build:
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  task: build
            - run: pnpm build

    docs-build:
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
              with:
                  task: docs-build
            - run: pnpm build:docs

    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm lint

    knip:
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.quality == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: pnpm dead-code:audit

    validation:
        needs: [changes, typecheck, test, build, docs-build, lint, knip]
        if: always()
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require all relevant checks to pass
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  echo "$RESULTS" | jq -e '
                    .changes.result == "success" and
                    all(.[]; .result == "success" or .result == "skipped")
                  '

    e2e:
        name: e2e (dev)
        needs: changes
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/e2e
              with:
                  version: dev
