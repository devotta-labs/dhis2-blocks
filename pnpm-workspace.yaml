packages:
    - apps/*
    - packages/blocks/*

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild

# Keep React's ambient types out of pnpm's shared hidden hoist. Each workspace
# resolves the version it declares, which lets the React 18 apps coexist with
# the React 19 documentation app.
hoistPattern:
    - '*'
    - '!@types/react'
    - '!@types/react-dom'

publicHoistPattern:
    - '@dhis2/ui'
    - typeface-roboto
    - '@dhis2/app-adapter'
    - prop-types
    - '@dhis2/d2-i18n'
    - post-robot
    - styled-jsx
    - '@dhis2/pwa'
